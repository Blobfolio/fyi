name: MSRV

on:
  push:
    branches: []
  pull_request:
    branches: []

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  all:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}

    name: All

    strategy:
      matrix:
        target:
        - x86_64-unknown-linux-gnu
        - aarch64-apple-darwin
        - x86_64-pc-windows-msvc
        include:
        - target: x86_64-unknown-linux-gnu
          os:     ubuntu-latest
        - target: aarch64-apple-darwin
          os:     macos-latest
        - target: x86_64-pc-windows-msvc
          os:     windows-latest

    runs-on: ${{matrix.os}}

    env:
      RUSTFLAGS: "-D warnings"

    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}
    - uses: taiki-e/install-action@v2
      with:
        tool: cargo-msrv

    - name: Info
      run: |
        rustup --version
        cargo --version
        cargo clippy --version

    - name: Prepare Windows Source Links
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        foreach ($path in 'fyi_ansi/skel/ansi256.rs', 'fyi_msg/skel/ansi256.rs') {
          if ((Get-Item -LiteralPath $path).LinkType -ne 'SymbolicLink') {
            Copy-Item -LiteralPath skel/ansi256.rs -Destination $path -Force
          }
        }

    - name: MSRV
      run: |
        cargo msrv --path fyi_msg verify -- cargo check --all-features
